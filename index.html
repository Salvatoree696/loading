<body>
<div id="fond"></div><div id="ombre"></div>
<div class="coin" id="c1"></div><div class="coin" id="c2"></div><div class="coin" id="c3"></div><div class="coin" id="c4"></div>

<div id="haut">PvP <b>&bull;</b> Loot <b>&bull;</b> Airdrops <b>&bull;</b> Squads</div>

<div id="bas">
  <div id="bienvenue">Welcome <span id="joueur">survivor</span></div>
  <div id="etat"><span id="pct"></span><span id="txtEtat">Connecting to the server...</span></div>
  <div id="barre"><div id="plein"></div></div>
  <div id="astuce"><b>TIP</b><span id="texteAstuce"></span></div>
</div>
<div id="pied"><span id="carte"></span><span class="s" id="sep" style="display:none">&bull;</span><span style="text-transform:none; letter-spacing:1px; color:#b9b1a8">discord.gg/TwCU49mcNh</span></div>

<script>
// GmodxDayZ loading screen. Garry's Mod calls the functions below while connecting.
var ASTUCES = [
  "Airdrops are not on the map: follow the sound of the helicopter and the explosions.",
  "Store your loot in the bank: it is never lost on death.",
  "If you disconnect in combat, everything you carry drops on the ground.",
  "Create a squad (P) so you can't hurt your teammates. Max 5 players.",
  "Your squad can ally with one other squad: allies get a yellow outline.",
  "Safe zones are the yellow circles on the map (M). Type /sz to go back.",
  "Press F1 for the server menu, the store and the leaderboard.",
  "Place barricades from your inventory to block a doorway.",
  "You can only change your skin inside a safe zone (F3).",
  "Type /help in the chat to see every command."
];
function id(n) { return document.getElementById(n); }

var total = 0, restants = -1, affiche = 0;   // restants = -1 : pas encore connu
function Pourcent(p) {
  p = Math.max(affiche, Math.max(0, Math.min(100, Math.round(p))));   // la barre ne recule jamais
  affiche = p;
  id("plein").style.width = p + "%";
  id("pct").innerHTML = p + " %";
}
function Barre() { if (total > 0 && restants >= 0) { Pourcent((total - restants) * 100 / total); } }

// --- called by Garry's Mod ---
function GameDetails(serveur, url, carte, maxJoueurs, steamid, mode) {
  id("carte").innerHTML = "Map : " + carte + " &nbsp;&bull;&nbsp; " + maxJoueurs + " slots";
  id("sep").style.display = "inline";
}
function SetFilesTotal(n) { total = n; Barre(); }
function SetFilesNeeded(n) { restants = n; Barre(); }
function DownloadingFile(nom) {
  var court = String(nom).split("/").pop();
  id("txtEtat").innerHTML = "Downloading : " + court;
  if (restants > 0) { restants = restants - 1; Barre(); }
}
function SetStatusChanged(etat) {
  var e = String(etat);
  id("txtEtat").innerHTML = e;
  if (e.indexOf("Sending client info") === 0 || e.indexOf("Client info sent") === 0) { Pourcent(100); }
  else if (e.indexOf("Workshop Complete") === 0) { Pourcent(80); }
  else if (e.indexOf("Parsing game info") === 0 || e.indexOf("Starting Lua") === 0) { Pourcent(92); }
}

// --- rotating tips ---
var n = Math.floor(Math.random() * ASTUCES.length);
function Astuce() {
  id("astuce").style.opacity = 0;
  setTimeout(function () {
    id("texteAstuce").innerHTML = ASTUCES[n % ASTUCES.length];
    n = n + 1;
    id("astuce").style.opacity = 1;
  }, 500);
}
id("texteAstuce").innerHTML = ASTUCES[n % ASTUCES.length]; n = n + 1;
setInterval(Astuce, 7000);

// preview in a normal browser : add #demo to the address
if (String(location.hash) === "#demo") {
  GameDetails("GmodxDayZ", "", "rp_stalker_thatgmodzserver", 64, "", "darkrp");
  SetFilesTotal(40); SetFilesNeeded(14); DownloadingFile("materials/models/weapons/v_models/ak47.vmt");
}
</script>
</body>
</html>
